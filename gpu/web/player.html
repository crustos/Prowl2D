<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prowl2D on the GPU physics engine</title>
<style>
  :root { color-scheme: dark; --bg: #101318; --fg: #d8dee9; --dim: #8892a6; --line: #262c38; --accent: #5b8def; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 12px 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { font-weight: 600; }
  header .dim { color: var(--dim); }
  main { flex: 1; min-height: 0; padding: 12px 16px 16px; display: flex; }
  canvas { flex: 1; width: 100%; height: 100%; min-width: 0; border-radius: 8px; background: #0b0e13; touch-action: none; cursor: crosshair; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: #1b212c; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: #3a4458; }
  button[aria-pressed=true] { border-color: var(--accent); }
  #msg { color: #e5a557; }
  @media (max-width: 600px) { header { padding: 8px 12px; } main { padding: 8px 12px 12px; } }
</style>
<header>
  <b id="title">Prowl2D</b>
  <span class="dim" id="stats">loading...</span>
  <span class="tools">
    <button data-tool="ball" aria-pressed="true" title="click: drop a ball">ball</button>
    <button data-tool="crate" aria-pressed="false" title="click: drop a crate (B)">crate</button>
    <button data-tool="sand" aria-pressed="false" title="drag: pour sand (F)">sand</button>
    <button data-tool="rope" aria-pressed="false" title="click: hang a rope (T)">rope</button>
    <button data-tool="blast" aria-pressed="false" title="click: blast (right click)">blast</button>
    <button id="reset" title="R">restart</button>
  </span>
  <span id="msg"></span>
</header>
<main><canvas id="screen"></canvas></main>
<script type="module" src="player.js"></script>
